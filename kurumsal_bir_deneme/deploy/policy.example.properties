# ==================================================================================================
#  Belge Tezgâhı (Document Workbench) - merkezi BT politikası
#
#  Konum:  %ProgramData%\DocumentWorkbench\policy.properties
#          (Install-DocumentWorkbench.ps1 buraya kopyalar ve Users grubuna yalnız OKUMA izni verir)
#
#  Kural:  Bu dosyada yazan her ayar kullanıcı tarafından DEĞİŞTİRİLEMEZ; uygulama ve Yönetim Paneli
#          bunları kilitli (🔒) gösterir. Yazılmayan her ayar eskisi gibi kullanıcıya kalır.
#          Dosya hiç yoksa program politikasız, bugünkü gibi çalışır.
#
#  Kodlama: UTF-8. Satır başındaki # işareti yorumdur. Değişiklikler programın bir sonraki açılışında geçerli olur.
# ==================================================================================================

# Politikanın sürüm etiketi; Yönetim Paneli, destek paketi ve sağlık raporunda görünür.
policy.version=2026-09-A

# ---------------------------------------------------------------- yönetici parolası
# Merkezi parola: yerel parolanın yerine geçer, kullanıcı değiştiremez.
# Oluşturmak için:  "C:\Program Files\DocumentWorkbench\dwb-cli.exe" --hash-passphrase
# (parolayı iki kez sorar ve aşağıdaki satırı yazdırır; parolanın kendisi hiçbir yere kaydedilmez)
#admin.passphrase.hash=pbkdf2$120000$....$....

# Yönetici oturumunun açık kalma süresi (dakika, 1-240).
#unlock.minutes=10

# ---------------------------------------------------------------- indeksleme
# Hiçbir zaman indekslenmeyecek dosya/klasör desenleri. * bir klasör adı içinde, ** her derinlikte eşleşir.
#exclude.1=**/Personel/**
#exclude.2=*.pst
#exclude.3=**/Muhasebe/Maaş/**

# add     = merkezi liste kullanıcının kendi listesine EKLENİR (varsayılan)
# replace = yalnızca merkezi liste geçerlidir
#exclude.mode=add

# Bellek tavanı: Java belleğinin bu oranı dolunca yeni belge alınmaz (0.50-0.95).
#memory.ceiling=0.85

# Toplu eklemede aynı anda işlenen dosya sayısı (1-8). Eski dizüstülerde 1 önerilir.
#workers=1

# ---------------------------------------------------------------- yapay zekâ
# false: yapay zekâ yanıtları tamamen kapalı (belge metni hiçbir dış servise gitmez). Yerel arama çalışır.
#ai.enabled=false

# Bilgisayar başına günlük / dakikalık çağrı sınırı ve izinli saatler.
#ai.daily=100
#ai.perMinute=5
#ai.hours=09:00-18:00
#ai.days=MON-FRI

# ---------------------------------------------------------------- web araması (@web)
#web.enabled=false
# Şirket içi SearXNG sunucusu kullanılıyorsa:
#web.provider=searxng
#web.endpoint=https://arama.sirket.local
#web.key=

# ---------------------------------------------------------------- ağ paylaşımı (masaüstü uygulaması ve dwb-cli)
# false: ağ paylaşımı tamamen kapalı.
#lan.enabled=false
# Güven modu (DWB_TRUST ortam değişkenini sabitler):
#   zero   (varsayılan) sıfır güven: her cihazın makineye mühürlü Ed25519 anahtarı vardır; yalnızca PIN ile
#          eşleştirilmiş cihazlar (trusted-peers.tsv) bağlanabilir, katalog ağa yayılmaz.
#   legacy eski protokol: açık mod ya da tüm bilgisayarlarda aynı DWB_SECRET.
#lan.trustMode=zero
# true: yalnızca kimliği doğrulanmış eşler (sıfır güven modu ya da legacy modda DWB_SECRET); açık mod reddedilir.
#lan.requireSecret=true

# ---------------------------------------------------------------- BT izleme
# Her bilgisayar bu klasöre düzenli olarak küçük bir durum dosyası yazar (<bilgisayar>-<kullanıcı>.txt).
# Belge adı veya içeriği içermez. Klasöre Users grubunun YAZMA izni olmalıdır.
#report.folder=\\\\sunucu\\paylasim\\dwb-saglik
#report.intervalMinutes=60

# "Destek Paketi Oluştur" zip dosyalarının varsayılan konumu (yoksa kullanıcının masaüstü).
#support.folder=\\\\sunucu\\paylasim\\dwb-destek
