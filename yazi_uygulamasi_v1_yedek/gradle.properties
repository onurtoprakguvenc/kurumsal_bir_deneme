# Workaround for the non-ASCII project path ("yazı uygulaması") on a Turkish Windows install.
# Gradle hands the test classpath to worker JVMs through an @argfile, written in the daemon's
# default charset; the java launcher reads that file in the Windows code page (Cp1254).
# Making the daemon use Cp1254 keeps both sides in agreement. Test JVMs still run in UTF-8
# (see build.gradle). Remove this line if the project moves to an ASCII-only path.
org.gradle.jvmargs=-Dfile.encoding=Cp1254
